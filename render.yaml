# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: fleetledger-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      # Optional override; if unset, prod settings use RENDER_EXTERNAL_HOSTNAME automatically.
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: fleetledger-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: fleetledger-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: fleetledger-redis
          type: redis
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: REPORT_ENCRYPTION_PASSWORD
        generateValue: true
      - key: SENTRY_DSN
        sync: false

  - type: worker
    name: fleetledger-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A config worker -l info
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        fromService:
          name: fleetledger-api
          type: web
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: fleetledger-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: fleetledger-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: fleetledger-redis
          type: redis
          property: connectionString
      - key: REPORT_ENCRYPTION_PASSWORD
        fromService:
          name: fleetledger-api
          type: web
          envVarKey: REPORT_ENCRYPTION_PASSWORD
      - key: SENTRY_DSN
        fromService:
          name: fleetledger-api
          type: web
          envVarKey: SENTRY_DSN

  - type: web
    name: fleetledger-dashboard
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

  - type: redis
    name: fleetledger-redis
    plan: free
    ipAllowList: []

databases:
  - name: fleetledger-db
    plan: free
    databaseName: fleetledger
    user: fleetledger
