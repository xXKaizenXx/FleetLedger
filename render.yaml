# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: fleetledger-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/auth/csrf/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: fleetledger-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: fleetledger-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: fleetledger-redis
          type: redis
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

  - type: worker
    name: fleetledger-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A config worker -l info
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        fromService:
          name: fleetledger-api
          type: web
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: fleetledger-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: fleetledger-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: fleetledger-redis
          type: redis
          property: connectionString

  - type: redis
    name: fleetledger-redis
    plan: free
    ipAllowList: []

databases:
  - name: fleetledger-db
    plan: free
    databaseName: fleetledger
    user: fleetledger
